  <text x="24" y="392" fill="#9aa3b5" font-size="11" font-weight="600" font-family="Segoe UI,Arial,sans-serif">LOWER - source, loads, USB PD</text>

  <rect x="16" y="402" width="300" height="360" rx="8" fill="#272c36" stroke="#3f4657" stroke-width="1.5"/>
