  <text x="172" y="208" fill="#55ff7f" font-size="13" font-weight="bold" font-family="Consolas,monospace">1.45</text>
  <text x="48" y="240" fill="#b8c0d0" font-size="10" font-family="Segoe UI,Arial,sans-serif">W</text>
  <text x="80" y="240" fill="#55ff7f" font-size="13" font-weight="bold" font-family="Consolas,monospace">334.2</text>
  <text x="140" y="240" fill="#b8c0d0" font-size="10" font-family="Segoe UI,Arial,sans-serif">PF</text>
  <text x="172" y="240" fill="#55ff7f" font-size="13" font-weight="bold" font-family="Consolas,monospace">98.1%</text>

