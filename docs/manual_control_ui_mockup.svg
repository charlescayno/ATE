  <rect x="900" y="402" width="284" height="360" rx="8" fill="#272c36" stroke="#3f4657" stroke-width="1.5"/>
  <text x="1042" y="426" fill="#dce1ea" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">USB PD SINK</text>
  <text x="916" y="460" fill="#b8c0d0" font-size="10" font-family="Segoe UI,Arial,sans-serif">Collapsible: caps, request, EPR</text>

  <rect x="16" y="748" width="1168" height="24" rx="4" fill="#151820"/>
  <text x="32" y="764" fill="#7a8498" font-size="9" font-family="Segoe UI,Arial,sans-serif">Header: Scope Run / Run Single / Stop + E-STOP</text>
