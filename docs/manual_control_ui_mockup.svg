  <rect x="328" y="402" width="560" height="360" rx="8" fill="#272c36" stroke="#3f4657" stroke-width="1.5"/>
  <rect x="340" y="412" width="536" height="40" rx="6" fill="#1d222c" stroke="#000"/>
  <text x="356" y="436" fill="#9aa3b5" font-size="11" font-weight="600" font-family="Segoe UI,Arial,sans-serif">ELECTRONIC LOAD - Discharge controls</text>
  <rect x="340" y="462" width="258" height="140" rx="8" fill="#1d222c" stroke="#000"/>
  <text x="356" y="486" fill="#9aa3b5" font-size="11" font-family="Segoe UI,Arial,sans-serif">E-LOAD CH1</text>
  <rect x="610" y="462" width="266" height="140" rx="8" fill="#1d222c" stroke="#000"/>
  <text x="626" y="486" fill="#9aa3b5" font-size="11" font-family="Segoe UI,Arial,sans-serif">E-LOAD CH2</text>
  <rect x="340" y="612" width="258" height="140" rx="8" fill="#1d222c" stroke="#000"/>
  <text x="356" y="636" fill="#9aa3b5" font-size="11" font-family="Segoe UI,Arial,sans-serif">E-LOAD CH3</text>
  <rect x="610" y="612" width="266" height="140" rx="8" fill="#242830" stroke="#505868" stroke-dasharray="6 4"/>
